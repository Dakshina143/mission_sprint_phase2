groups:
  - name: missionsprint
    rules:
      - alert: BackendDown
        expr: up{job="missionsprint-backend"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: MissionSprint API is not answering Prometheus scrapes
      - alert: DatabaseDown
        expr: missionsprint_database_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: The API cannot reach PostgreSQL
      - alert: HighServerErrorRate
        expr: >
          sum(rate(missionsprint_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(missionsprint_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of API requests are failing with 5xx
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(missionsprint_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 95th percentile API latency is above 1 second
