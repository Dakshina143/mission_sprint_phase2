name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: missionsprint
          POSTGRES_PASSWORD: ci_only_password   # throw-away service container, not a real credential
          POSTGRES_DB: missionsprint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U missionsprint -d missionsprint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci_only_password
      TEST_DATABASE_URL: postgresql+psycopg2://missionsprint:ci_only_password@localhost:5432/missionsprint_test
      MIGRATION_DATABASE_URL: postgresql+psycopg2://missionsprint:ci_only_password@localhost:5432/missionsprint_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Tests on PostgreSQL
        run: python -m pytest -v
      - name: Tests on SQLite (fast path)
        env:
          TEST_DATABASE_URL: ""
        run: python -m pytest -q
      - name: Migrations apply, match the models, and roll back
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          psql -h localhost -U missionsprint -d missionsprint_test -c "CREATE DATABASE missionsprint_migrations"
          flask --app wsgi db upgrade
          flask --app wsgi db check
          flask --app wsgi seed
          flask --app wsgi db downgrade base
          flask --app wsgi db upgrade

  frontend:
    name: Frontend tests and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with a random database password
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "SEED_DEMO_DATA=true" >> .env
      - name: Validate compose file
        run: docker compose --profile monitoring config -q
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1 check config /etc/prometheus/prometheus.yml
      - name: Build images
        run: docker compose --profile monitoring build
      - name: Start stack with monitoring
        run: docker compose --profile monitoring up -d --wait --wait-timeout 180
      - name: Smoke test application through the frontend proxy
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\">"
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"database":"connected"'
          curl -fsS http://localhost:8080/api/dashboard | grep -q '"demo_data_present":true'
      - name: Verify Prometheus is scraping real backend metrics
        run: |
          for i in $(seq 1 24); do
            v=$(curl -fsS 'http://localhost:9090/api/v1/query?query=missionsprint_database_up' | python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; print(r[0]['value'][1] if r else '')")
            [ "$v" = "1" ] && echo "missionsprint_database_up=1" && exit 0
            sleep 5
          done
          echo "Prometheus did not report missionsprint_database_up=1" >&2; exit 1
      - name: Grafana health and provisioned dashboard
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -u "admin:$(grep ^GRAFANA_ADMIN_PASSWORD .env | cut -d= -f2)" 'http://localhost:3000/api/search?query=MissionSprint' | grep -q missionsprint-overview
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --no-color --tail=100
      - name: Tear down
        if: always()
        run: docker compose --profile monitoring down -v

  ci-ok:
    name: All required checks passed
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
